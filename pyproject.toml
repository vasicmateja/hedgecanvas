[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgecanvas"
version = "0.1.0"
description = "Crypto Portfolio Protection Analytics - WealthTech prototype for the thesis 'Option-Based Downside Protection for Crypto Portfolios: A WealthTech Prototype and Backtesting Study.'"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires network access to the real Deribit production API; skipped unless HEDGECANVAS_LIVE_TESTS=1 is set",
]
